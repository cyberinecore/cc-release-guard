name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Dogfood the CLI package
        working-directory: cli
        run: |
          mkdir -p ../out
          npm pack --pack-destination ../out
          node shipsafe.mjs check ../out/*.tgz
